<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="从泥板上的一笔债，到手机里的一条消息：金钱怎样诞生、怎样变形、怎样在世界各地互相牵连——一部带对白、装置和小游戏的编年史。">
<meta property="og:title" content="点石成金 · 金钱创世记">
<meta property="og:description" content="从泥板上的一笔债，到手机里的一条消息：金钱怎样诞生、怎样变形、怎样在世界各地互相牵连。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23b0352b'/%3E%3Crect x='11.5' y='11.5' width='9' height='9' fill='%23f2ead6'/%3E%3C/svg%3E">
<title>点石成金</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap">
<style>
/* ZCOOL XiaoWei 把“回”字画成实心方块：这一个字改用系统宋体/黑体，其余字不变 */
@font-face{font-family:"Hui Fix";unicode-range:U+56DE;src:local("Songti SC"),local("STSongti-SC-Regular"),local("STSong"),local("SimSun"),local("宋体"),local("Noto Serif CJK SC"),local("NotoSerifCJKsc-Regular"),local("Source Han Serif SC"),local("SourceHanSerifSC-Regular"),local("PingFang SC"),local("PingFangSC-Regular"),local("Microsoft YaHei"),local("Noto Sans CJK SC"),local("NotoSansCJKsc-Regular"),local("Droid Sans Fallback")}

/* 版式：一本夹着钞票的旧账簿。正文是账页，装置是夹进去的票据；卷首做成钞票的票面。 */
:root{
  --paper:#ede3cd;      /* 账簿纸 */
  --paper-2:#e4d9c0;
  --card:#f3eada;
  --ink:#1c2621;        /* 墨绿黑 */
  --ink-2:#4b5650;
  --ink-3:#5e655f;
  --rule:#cbbf9f;
  --seal:#b0352b;       /* 朱砂 */
  --seal-2:#d9564a;
  --intag:#2c6652;      /* 凹版绿 */
  --intag-2:#6fa58f;
  --gold:#a7802c;
  --silver:#8e9aa3;
  --copper:#b06a3b;
  --sea:#4f7c93;
  --hl:color-mix(in srgb,var(--gold) 26%,transparent);
  --f-display:"Hui Fix","ZCOOL XiaoWei","Songti SC","STSong","Noto Serif SC",serif;
  --f-body:"Noto Serif SC","Songti SC","Source Han Serif SC","STSong",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101613; --paper-2:#151d19; --card:#18211c; --ink:#e6e0cf; --ink-2:#aab0a4; --ink-3:#757f78;
  --rule:#2c3832; --seal:#e0604f; --seal-2:#f08a76; --intag:#73b79c; --intag-2:#3f7a65;
  --gold:#d9b25a; --silver:#b8c3cb; --copper:#d98c58; --sea:#7fb1c9; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101613; --paper-2:#151d19; --card:#18211c; --ink:#e6e0cf; --ink-2:#aab0a4; --ink-3:#757f78;
  --rule:#2c3832; --seal:#e0604f; --seal-2:#f08a76; --intag:#73b79c; --intag-2:#3f7a65;
  --gold:#d9b25a; --silver:#b8c3cb; --copper:#d98c58; --sea:#7fb1c9; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.9;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit;text-decoration-color:var(--seal);text-underline-offset:3px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
svg text{font-family:var(--f-body)}

/* 页眉 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{max-width:56rem;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:8px}
.bar .home{text-decoration:none;font-size:13px;color:var(--ink-3);white-space:nowrap;border:1px solid var(--rule);border-radius:999px;padding:1px 9px}
.bar .name{font-family:var(--f-display);font-size:19px;letter-spacing:.05em;white-space:nowrap}
.bar .vol{margin-left:auto;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .yr{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px;color:var(--seal);min-width:5.6em;text-align:right}
.bar .tocbtn{border:1px solid var(--rule);background:transparent;border-radius:6px;padding:0 8px;font-size:13px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--seal);width:0}

/* 浮动目录 */
.drawer{position:fixed;inset:0;z-index:40;display:none}
.drawer.on{display:block}
.drawer .mask{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(360px,88vw);background:var(--paper);border-left:1px solid var(--rule);overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.drawer h5{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 10px}
.drawer ol{list-style:none;margin:0;padding:0}
.drawer li a{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--rule);text-decoration:none;font-size:15px;line-height:1.5}
.drawer li a .n{font-family:var(--f-mono);font-size:12px;color:var(--seal);min-width:3.2em;padding-top:2px}
.drawer li a small{display:block;color:var(--ink-3);font-size:12px}
.drawer .x{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--ink-2)}

main{display:block}
.col{max-width:38rem;margin-inline:auto}
.wide{max-width:54rem;margin-inline:auto}
.col p{margin:0 0 1.05em;text-indent:2em}
.col p.ni,.col .ni{text-indent:0}
h2,h3,h4{text-wrap:balance}
h3{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.4;margin:2.2em 0 .7em;letter-spacing:.03em}
h3 .y{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);margin-left:10px;letter-spacing:0;white-space:nowrap}
.mono{font-family:var(--f-mono)}
em{font-style:normal;background:linear-gradient(transparent 62%,var(--hl) 62%)}
strong{font-weight:600}
blockquote{margin:1.4em 0;padding:.2em 0 .2em 1.2em;border-left:2px solid var(--seal);color:var(--ink-2)}
blockquote p{text-indent:0!important;margin:0 0 .4em}
blockquote cite{font-style:normal;font-size:14px;color:var(--ink-3)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.figcap{font-size:14px;color:var(--ink-2);line-height:1.7;margin-top:8px}
svg{max-width:100%;height:auto;display:block}

/* 开篇 */
.hero{padding-block:48px 24px}
.hero .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--ink-3)}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(56px,13vw,120px);line-height:1;margin:.25em 0 .3em;letter-spacing:.08em}
.hero h1 .sm{display:block;font-size:.22em;letter-spacing:.3em;color:var(--seal);margin-top:.5em}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:36px;align-items:center}
.hero-grid p{margin:0 0 1em;font-size:18px}

/* 钞票 */
.bill{position:relative;aspect-ratio:2.1/1;border-radius:6px;background:var(--card);border:1px solid var(--rule);overflow:hidden;transition:filter .8s,opacity .8s;box-shadow:0 1px 0 var(--rule)}
.bill svg.gl{position:absolute;inset:0;width:100%;height:100%}
.bill .frame{position:absolute;inset:7px;border:1.5px solid var(--intag);border-radius:4px}
.bill .frame::after{content:"";position:absolute;inset:3px;border:.5px solid var(--intag);border-radius:3px}
.bill .den{position:absolute;font-family:var(--f-display);color:var(--intag);font-size:clamp(22px,4.6vw,34px);line-height:1;transition:opacity .8s}
.bill .den.tl{left:16px;top:14px}.bill .den.br{right:16px;bottom:12px}
.bill .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-family:var(--f-display);color:var(--ink)}
.bill .mid .big{font-size:clamp(22px,4.2vw,38px);letter-spacing:.1em;line-height:1.1;white-space:nowrap;transition:opacity .8s}
.bill .mid .tiny{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--ink-3)}
.bill .serial{position:absolute;right:18px;top:14px;font-family:var(--f-mono);font-size:11px;color:var(--seal);letter-spacing:.1em}
.bill .seal{position:absolute;left:18px;bottom:14px;width:40px;height:40px;border:2px solid var(--seal);color:var(--seal);border-radius:4px;display:grid;place-items:center;font-family:var(--f-display);font-size:13px;line-height:1.05;text-align:center;transform:rotate(-8deg);transition:opacity .8s}
.bill.doubt{filter:grayscale(1) contrast(.7);opacity:.75}
.bill.doubt .den,.bill.doubt .seal,.bill.doubt .gl{opacity:.06}
.bill .plain{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--ink-3);opacity:0;transition:opacity .8s;pointer-events:none}
.bill.doubt .plain{opacity:1}.bill.doubt .mid{opacity:0}
.billbox{display:flex;flex-direction:column;gap:12px}
.billbox .cap{font-size:14px;color:var(--ink-2);line-height:1.7;min-height:3.4em}

/* 目录 */
.toc{list-style:none;margin:28px 0 0;padding:0;border-top:1px solid var(--rule)}
.toc li a{display:grid;grid-template-columns:3.6em minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.toc .n{font-family:var(--f-mono);font-size:12px;color:var(--seal)}
.toc .t{font-family:var(--f-display);font-size:21px;line-height:1.3}
.toc .t small{display:block;font-family:var(--f-body);font-size:13px;color:var(--ink-3);margin-top:2px}
.toc .r{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);text-align:right;white-space:nowrap}
.toc li a:hover .t{color:var(--seal)}

/* 卷首：票面 */
section.vol{padding-top:30px}
.volhead{position:relative;max-width:54rem;margin:46px auto 28px;padding:28px 22px 22px;border:1.5px solid var(--intag);border-radius:6px;overflow:hidden;background:var(--card)}
.volhead::after{content:"";position:absolute;inset:5px;border:.5px solid var(--intag);border-radius:4px;pointer-events:none}
.volhead svg.gl{position:absolute;right:-60px;top:50%;transform:translateY(-50%);width:300px;height:300px;opacity:.45;pointer-events:none}
.volhead .num{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--seal)}
.volhead h2{position:relative;font-family:var(--f-display);font-weight:400;font-size:clamp(56px,12vw,88px);line-height:1;margin:.12em 0 .18em;letter-spacing:.1em}
.volhead .meta{position:relative;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13.5px;color:var(--ink-2)}
.volhead .meta .range{font-family:var(--f-mono);color:var(--ink)}
.volhead .lede{position:relative;max-width:30em;margin:12px 0 0;font-size:15px;color:var(--ink-2);line-height:1.75}
.volhead .sn{position:absolute;right:18px;top:16px;font-family:var(--f-mono);font-size:11px;color:var(--seal);letter-spacing:.12em}

/* 对白：一场戏 */
.scene{margin:2em 0;border:1px solid var(--rule);border-radius:6px;background:var(--card);overflow:hidden}
.scene .sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--paper-2)}
.scene .sh b{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.06em}
.scene .sh span{font-size:13px;color:var(--ink-3)}
.scene .bd{padding:12px 16px 14px}
.scene .ln{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:10px;margin:0 0 .55em;line-height:1.8}
.scene .ln .who{font-size:13px;text-align:right;padding-top:3px;white-space:nowrap;color:var(--ink-2)}
.scene .ln .who.s{color:var(--intag);font-weight:600}
.scene .ln .who.d{color:var(--seal);font-weight:600}
.scene .ln .who.j{color:var(--gold);font-weight:600}
.scene .ln p{margin:0;text-indent:0!important}
.scene .sd{color:var(--ink-3);font-size:14px;margin:.2em 0 .7em 5.2em;line-height:1.7}
.scene .sd::before{content:"（"}.scene .sd::after{content:"）"}
.cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15em),1fr));gap:12px;margin:1.4em 0}
.cast div{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--card);font-size:14.5px;line-height:1.7}
.cast b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;margin-bottom:2px}
.cast .s b{color:var(--intag)}.cast .d b{color:var(--seal)}.cast .j b{color:var(--gold)}

/* 装置 */
.fig{margin:2.2em auto;padding:20px 18px;background:var(--card);border:1px solid var(--rule);border-radius:6px}
.fig-label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;color:var(--seal)}
.fig h4{font-family:var(--f-display);font-weight:400;font-size:22px;margin:.25em 0 .35em}
.fig .how{font-size:14.5px;color:var(--ink-2);margin:0 0 14px;line-height:1.75}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--ink-3);background:transparent;border-radius:999px;padding:4px 14px;font-size:14px;cursor:pointer;line-height:1.6;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.red{background:var(--seal);color:#fff;border-color:var(--seal)}
.btn.on{background:var(--intag);border-color:var(--intag);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.readout{font-size:14.5px;color:var(--ink-2);line-height:1.7}
.readout b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.big-num{font-family:var(--f-mono);font-size:28px;line-height:1.2;color:var(--ink);word-break:break-all}
.rng{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.rng output{font-family:var(--f-mono);min-width:4.5em;text-align:right}
input[type=range]{width:100%;accent-color:var(--seal)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.panel{border:1px dashed var(--rule);border-radius:6px;padding:12px}
.panel h5{margin:0 0 6px;font-size:13px;color:var(--ink-3);font-weight:400;letter-spacing:.08em}
.log{font-size:13.5px;line-height:1.65;color:var(--ink-2);max-height:13em;overflow:auto;border-top:1px dashed var(--rule);margin-top:10px;padding-top:8px}
.log div{margin:0 0 3px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--rule);border-radius:4px;padding:0 6px;margin-right:4px;color:var(--ink-2)}
.meter{height:8px;border-radius:4px;background:var(--paper-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--intag);transition:width .3s}

/* 眉批（史上的回声） */
.echo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;margin:1.6em 0;padding:14px 14px 10px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.echo .stamp{writing-mode:vertical-rl;font-family:var(--f-display);font-size:15px;color:var(--seal);border:1.5px solid var(--seal);border-radius:3px;padding:6px 2px;letter-spacing:.2em;align-self:start}
.echo[data-k="讽刺"] .stamp{color:var(--intag);border-color:var(--intag)}
.echo[data-k="存疑"] .stamp{color:var(--ink-3);border-color:var(--ink-3)}
.echo[data-k="联系"] .stamp{color:var(--sea);border-color:var(--sea)}
.echo[data-k="生活"] .stamp{color:var(--gold);border-color:var(--gold)}
.echo p{text-indent:0!important;margin:0 0 .5em;font-size:15.5px;line-height:1.8}
.echo .rh{font-family:var(--f-display);font-size:18px;margin-bottom:.2em}
.echo .ry{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);margin-right:8px}

/* 戏里戏外 */
.drama{margin:2em 0;padding:16px 18px;border-radius:6px;background:var(--ink);color:var(--paper)}
/* 深色模式下不反白成大块亮底 */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drama{background:color-mix(in srgb,var(--seal) 9%,var(--paper-2));color:var(--ink);border-left:3px solid var(--seal)}}
:root[data-theme="dark"] .drama{background:color-mix(in srgb,var(--seal) 9%,var(--paper-2));color:var(--ink);border-left:3px solid var(--seal)}
.drama .dh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.drama .dh b{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.06em}
.drama .dh span{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;opacity:.65}
.drama p{text-indent:0!important;margin:0 0 .6em;font-size:15.5px;line-height:1.85}
.drama em{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--seal) 55%,transparent) 62%)}
.drama .src{font-size:12.5px;opacity:.6}

/* 带走一句 */
.takeaway{margin:2.4em 0 1em;padding:16px 18px;border:1.5px solid var(--seal);border-radius:6px;position:relative}
.takeaway::before{content:"带走";position:absolute;top:-11px;left:14px;background:var(--paper);padding:0 6px;font-family:var(--f-display);color:var(--seal);font-size:15px;letter-spacing:.2em}
.takeaway p{text-indent:0!important;margin:0 0 .4em}
.takeaway .life{font-size:15px;color:var(--ink-2)}

/* 表 */
table.t{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.6}
table.t th,table.t td{border-bottom:1px solid var(--rule);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{font-weight:400;color:var(--ink-3);font-size:13px}
table.t{min-width:520px}table.t td:first-child{white-space:nowrap}
table.t td.y{font-family:var(--f-mono);white-space:nowrap;color:var(--ink-2)}

/* 各装置专用 */
.vill{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,9.5em),1fr));gap:10px}
.vill button{border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:10px 8px;text-align:center;cursor:pointer;line-height:1.5}
.vill button .ic{font-size:26px;display:block}
.vill button small{display:block;font-size:12px;color:var(--ink-3)}
.vill button.hit{border-color:var(--intag);box-shadow:0 0 0 2px color-mix(in srgb,var(--intag) 30%,transparent)}
.vill button.miss{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.inv{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0 4px;font-size:15px}
.inv .hand{font-size:26px}
.yap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.coinwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;max-width:420px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--silver);transition:background .4s,opacity .4s}
.dots i.bad{background:var(--copper)}
.dots i.gone{opacity:.12}
.mapnode{cursor:pointer}
.mapnode circle{transition:r .2s}
.mapnode:hover circle,.mapnode.on circle{stroke:var(--seal);stroke-width:2.5}
.mapinfo{min-height:7em}
.mapinfo h5{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 4px}
.mapinfo p{margin:0;font-size:14.5px;line-height:1.75;text-indent:0!important}
.queue{display:flex;flex-wrap:wrap;gap:4px;min-height:34px;margin:8px 0}
.queue span{font-size:20px;line-height:1}
.vault{font-family:var(--f-mono);font-size:30px}
.ticker{font-size:14px;color:var(--ink-2);min-height:3.2em;border-left:2px solid var(--gold);padding-left:10px;margin:8px 0}
canvas.chart{width:100%;height:220px;display:block;background:var(--paper);border:1px solid var(--rule);border-radius:4px}
.cbank .stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.cbank .stat div{border:1px solid var(--rule);border-radius:6px;padding:6px 10px;font-size:12.5px;color:var(--ink-3)}
.cbank .stat b{display:block;font-family:var(--f-mono);font-size:20px;color:var(--ink);font-weight:500}
.quiz .opt{display:block;width:100%;text-align:left;border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:10px 12px;margin:6px 0;cursor:pointer;line-height:1.6}
.quiz .opt.pick{border-color:var(--seal);box-shadow:0 0 0 2px color-mix(in srgb,var(--seal) 25%,transparent)}
.tl{position:relative}
.tlfilters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tlcard{min-height:6em;border-top:1px dashed var(--rule);margin-top:10px;padding-top:10px}
.tlcard p{text-indent:0!important;margin:0 0 .3em;font-size:15px}
.tlcard .k{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}

/* 尾部 */
footer{max-width:38rem;margin:60px auto 0;padding:24px 0 calc(40px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);font-size:14px;color:var(--ink-3);line-height:1.8}
footer p{text-indent:0!important}
.nextbook{display:block;margin:20px 0;padding:14px 16px;border:1px solid var(--rule);border-radius:6px;text-decoration:none;background:var(--card)}
.nextbook b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ink)}

@media (max-width:700px){
  body{font-size:16.5px}
  .hero-grid,.two,.yap{grid-template-columns:minmax(0,1fr)}
  .toc li a{grid-template-columns:3em minmax(0,1fr)}
  .toc .r{grid-column:2;text-align:left}
  .scene .ln{grid-template-columns:minmax(0,1fr);gap:0}
  .scene .ln .who{text-align:left;padding-top:0}
  .scene .sd{margin-left:0}
  .volhead svg.gl{width:220px;height:220px;right:-70px}
  .coinwrap{grid-template-columns:minmax(0,1fr)}
  .bar .vol{display:none}
  .cbank .stat b{font-size:17px}
}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>
