<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="一副给散步时用的卡片：一百张“路上聊”，古人的脑洞、动物、天文、电影幕后、名人怪癖、离谱的大人物、至今没人懂的事、保命常识，还有逛博物馆、园林、街道时能讲的。每张三五分钟，结尾留一个抛给对方的问题。可以按主题、类型、地点筛选。">
<meta property="og:title" content="回宿舍的路 · 路上聊">
<meta property="og:description" content="从图书馆走回去的那十几分钟，聊点什么？一百张卡，每张一个真实的故事，和一个留给对方的问题。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23182030'/%3E%3Cpath d='M12,29 V9 Q12,6 15,6 H19' stroke='%23d9c9a3' stroke-width='2' fill='none'/%3E%3Cpath d='M16,7 h6 l-1.5,3 h-3z' fill='%23e8b450'/%3E%3Cpath d='M17.5,10 L11,27 H28 L20.5,10z' fill='%23e8b450' opacity='.35'/%3E%3C/svg%3E">
<title>回宿舍的路</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap">
<style>
/* ZCOOL XiaoWei 把“回”字画成实心方块：这一个字改用系统宋体/黑体，其余字不变 */
@font-face{font-family:"Hui Fix";unicode-range:U+56DE;src:local("Songti SC"),local("STSongti-SC-Regular"),local("STSong"),local("SimSun"),local("宋体"),local("Noto Serif CJK SC"),local("NotoSerifCJKsc-Regular"),local("Source Han Serif SC"),local("SourceHanSerifSC-Regular"),local("PingFang SC"),local("PingFangSC-Regular"),local("Microsoft YaHei"),local("Noto Sans CJK SC"),local("NotoSansCJKsc-Regular"),local("Droid Sans Fallback")}

/* 版式：夜路。浅色是黄昏前的暖纸，深色是路灯下的夜。卡片像一张张索引卡，顶上一条主题色。 */
:root{
  --paper:#ece3cf; --paper-2:#e1d7bf; --card:#f3ebda;
  --ink:#1f2228; --ink-2:#4b4e55; --ink-3:#5d5f66; --rule:#cfc3a8;
  --lamp:#8a5a0c; --glow:#e7b54d; --night:#2b4a6f;
  --btn:#2b4a6f; --btn-fg:#f3ebda;
  --sky1:#d9cfb7; --sky2:#e9dfc8; --bld:#b9ab8d; --win:#e7b54d;
  --c-jq:#2c6a6e; --c-nd:#7d600f; --c-dw:#3d6b2e; --c-tk:#2f5584; --c-yp:#8a3557; --c-gr:#6a4c93; --c-lp:#b0352b; --c-md:#2c6a6e; --c-bm:#9a4416; --c-gg:#6e4526;
  --hl:color-mix(in srgb,var(--glow) 34%,transparent);
  --f-display:"Hui Fix","ZCOOL XiaoWei","Songti SC","STSong","Noto Serif SC",serif;
  --f-body:"Noto Serif SC","Songti SC","Source Han Serif SC","STSong",serif;
  --f-kai:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151d; --paper-2:#181d27; --card:#1b212c; --ink:#e8e2d3; --ink-2:#b5afa0; --ink-3:#8d8a80; --rule:#2e3644;
  --lamp:#e7b54d; --glow:#e7b54d; --night:#8fb0e3; --btn:#6b4f17; --btn-fg:#f6e3b0;
  --sky1:#0d1119; --sky2:#151b27; --bld:#232b3a; --win:#e7b54d;
  --c-jq:#6fb5b0; --c-nd:#d4b056; --c-dw:#8fc47a; --c-tk:#8fb0e3; --c-yp:#e28aac; --c-gr:#b39ae0; --c-lp:#e87a6c; --c-md:#6fb5b0; --c-bm:#e89a6a; --c-gg:#c99a6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151d; --paper-2:#181d27; --card:#1b212c; --ink:#e8e2d3; --ink-2:#b5afa0; --ink-3:#8d8a80; --rule:#2e3644;
  --lamp:#e7b54d; --glow:#e7b54d; --night:#8fb0e3; --btn:#6b4f17; --btn-fg:#f6e3b0;
  --sky1:#0d1119; --sky2:#151b27; --bld:#232b3a; --win:#e7b54d;
  --c-jq:#6fb5b0; --c-nd:#d4b056; --c-dw:#8fc47a; --c-tk:#8fb0e3; --c-yp:#e28aac; --c-gr:#b39ae0; --c-lp:#e87a6c; --c-md:#6fb5b0; --c-bm:#e89a6a; --c-gg:#c99a6e; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit;text-decoration-color:var(--lamp);text-underline-offset:3px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
svg{max-width:100%;height:auto;display:block}
em{font-style:normal;background:linear-gradient(transparent 60%,var(--hl) 60%)}
strong{font-weight:600}
.col{max-width:40rem;margin-inline:auto}
.wide{max-width:60rem;margin-inline:auto}

/* 页眉 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{max-width:60rem;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:8px}
.bar .home{text-decoration:none;font-size:13px;color:var(--ink-3);white-space:nowrap;border:1px solid var(--rule);border-radius:999px;padding:1px 9px}
.bar .name{font-family:var(--f-display);font-size:19px;letter-spacing:.06em;white-space:nowrap}
.bar nav{margin-left:auto;display:flex;gap:4px;min-width:0}
.bar nav a{font-size:13px;color:var(--ink-2);text-decoration:none;white-space:nowrap;padding:1px 7px;border-radius:6px}
.bar nav a:hover{background:var(--paper-2)}

/* 封面 */
.hero{padding-block:34px 10px}
.hero .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--ink-3)}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(56px,14vw,118px);line-height:1;margin:.22em 0 .18em;letter-spacing:.1em}
.hero h1 small{display:block;font-size:.19em;letter-spacing:.32em;color:var(--ink-2);margin-top:.7em}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px;align-items:center}
.hero-grid p{margin:0 0 1em;font-size:17.5px}
.scene-svg{border-radius:10px;overflow:hidden;border:1px solid var(--rule)}
@media (max-width:720px){.hero-grid{grid-template-columns:minmax(0,1fr)}.scene-svg{order:-1}}

/* 怎么用 */
.how{counter-reset:h;list-style:none;margin:1.2em 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:10px}
.how li{counter-increment:h;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:12px 14px 12px 46px;position:relative;font-size:15px;line-height:1.7}
.how li::before{content:counter(h);position:absolute;left:12px;top:11px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--lamp);color:var(--lamp);display:grid;place-items:center;font-family:var(--f-mono);font-size:12.5px}
.how b{display:block;font-weight:600;color:var(--ink)}
.kinds{display:flex;flex-wrap:wrap;gap:8px 14px;margin:14px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink-2)}
.kinds li{display:flex;gap:6px;align-items:baseline}
.kd{display:inline-grid;place-items:center;min-width:1.9em;height:1.9em;padding:0 .35em;border:1.3px solid currentColor;border-radius:50%;font-family:var(--f-display);font-size:15px;line-height:1;color:var(--ink-2)}
.kinds .kd{font-size:13.5px}

h2.sec{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6.4vw,44px);line-height:1.15;letter-spacing:.06em;margin:56px 0 10px}
h2.sec small{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--lamp);margin-bottom:6px}
.lede{color:var(--ink-2);font-size:16px;margin:0 0 1em}

/* 抽卡台 */
.draw{margin-top:34px;padding:18px 16px 20px;border:1px solid var(--rule);border-radius:14px;background:var(--paper-2);display:none}
.js .draw{display:block}
.dr-top{display:flex;flex-wrap:wrap;gap:10px}
.big{flex:1 1 11rem;border:0;border-radius:10px;padding:12px 16px;background:var(--btn);color:var(--btn-fg);font-family:var(--f-display);font-size:21px;letter-spacing:.08em;cursor:pointer;transition:transform .12s}
.big:active{transform:scale(.98)}
.big.alt{background:transparent;color:var(--ink);border:1.5px solid var(--btn)}
.big small{display:block;font-family:var(--f-body);font-size:12.5px;letter-spacing:.02em;opacity:.85;margin-top:1px}
.fl{margin-top:14px}
.fl .lb{font-size:12.5px;color:var(--ink-3);font-family:var(--f-mono);letter-spacing:.08em;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:2px 11px;font-size:14px;cursor:pointer;color:var(--ink-2);line-height:1.7}
.chip[aria-pressed="true"]{border-color:var(--cc,var(--ink));color:var(--cc,var(--ink));box-shadow:inset 0 0 0 1px var(--cc,var(--ink));font-weight:600}
.chip i{font-style:normal;font-family:var(--f-mono);font-size:11.5px;opacity:.75;margin-left:3px}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:12px;font-size:14px;color:var(--ink-2)}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts input{accent-color:var(--night);width:17px;height:17px}
.linkbtn{border:0;background:none;padding:0;font-size:13.5px;color:var(--ink-3);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;cursor:pointer}
.stat{font-size:13.5px;color:var(--ink-3)}
.stage{margin-top:16px;min-height:120px}
@media (max-width:520px){.draw{padding:14px 10px 16px;margin-inline:-4px}.stage .cd{padding:14px 13px}}
.stage .empty{border:1.5px dashed var(--rule);border-radius:12px;padding:26px 18px;text-align:center;color:var(--ink-3);font-size:15px}
.stage .empty b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--ink-2);margin-bottom:4px}
.stage-nav{display:none;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.stage-nav.on{display:flex}
.stage-nav .pos{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3);margin-right:auto}
.sbtn{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:5px 12px;font-size:14.5px;cursor:pointer}
.sbtn:disabled{opacity:.4;cursor:default}
.sbtn.told[aria-pressed="true"]{border-color:var(--c-jq);color:var(--c-jq);font-weight:600}
.sbtn.go{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}

/* 卡片 */
.deck{margin-top:10px}
.deck-h{display:flex;align-items:baseline;gap:12px;margin:46px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--cc)}
.deck-h h2{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,38px);margin:0;letter-spacing:.08em;color:var(--cc)}
.deck-h span{font-size:13.5px;color:var(--ink-3)}
.deck .lede{margin:8px 0 14px;font-size:15px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.js .grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr));gap:10px}

.cd{--cc:var(--ink-2);position:relative;background:var(--card);border:1px solid var(--rule);border-top:5px solid var(--cc);border-radius:10px;padding:14px 16px 14px;scroll-margin-top:70px}
[data-t="脑洞"],[data-theme="脑洞"]{--cc:var(--c-nd)} [data-t="动物"],[data-theme="动物"]{--cc:var(--c-dw)} [data-t="天上"],[data-theme="天上"]{--cc:var(--c-tk)} [data-t="银幕"],[data-theme="银幕"]{--cc:var(--c-yp)} [data-t="怪人"],[data-theme="怪人"]{--cc:var(--c-gr)} [data-t="离谱"],[data-theme="离谱"]{--cc:var(--c-lp)} [data-t="没人懂"],[data-theme="没人懂"]{--cc:var(--c-md)} [data-t="保命"],[data-theme="保命"]{--cc:var(--c-bm)} [data-t="逛"],[data-theme="逛"]{--cc:var(--c-gg)}
.where{margin:.2em 0 .7em;font-size:12.5px;color:var(--ink-3);font-family:var(--f-mono);letter-spacing:.06em}
.where i{font-style:normal;display:inline-block;border:1px solid var(--rule);border-radius:99px;padding:0 .6em;margin:0 .3em .2em 0;background:var(--paper)}
.js .grid .cd .where{display:none}
.cd-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.cd-h .th{font-family:var(--f-mono);letter-spacing:.1em;color:var(--cc)}
.cd-h .kd{color:var(--cc);border-color:var(--cc);font-size:13px;min-width:1.85em;height:1.85em}
.cd-h .no{margin-left:auto;font-family:var(--f-mono)}
.cd-h .min{font-family:var(--f-mono)}
.cd h3{font-family:var(--f-display);font-weight:400;font-size:25px;line-height:1.3;margin:.3em 0 .25em;letter-spacing:.04em;text-wrap:balance}
.cd .hook{margin:0 0 .6em;font-family:var(--f-kai);font-size:17.5px;line-height:1.7;color:var(--ink);padding-left:12px;border-left:3px solid var(--cc)}
.cd .hook::before{content:"开口 ";font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--cc);vertical-align:2px}
.cd .body p{margin:0 0 .8em;text-indent:2em;font-size:16px}
.cd .body p.ni{text-indent:0}
.cd blockquote{margin:.6em 0 .9em;padding:.1em 0 .1em 1em;border-left:2px solid var(--cc);font-family:var(--f-kai);font-size:16.5px;color:var(--ink-2)}
.cd blockquote cite{display:block;font-style:normal;font-family:var(--f-body);font-size:13px;color:var(--ink-3)}
.cd .eg{list-style:none;margin:.2em 0 .9em;padding:0;font-size:15px}
.cd .eg li{padding:4px 0;border-bottom:1px dashed var(--rule)}
.cd .eg li b{font-weight:400;font-family:var(--f-kai);color:var(--ink-2)}
.guess{margin:.4em 0 1em;border:1.5px solid var(--cc);border-radius:9px;background:color-mix(in srgb,var(--cc) 7%,var(--card))}
.guess summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:15.5px;list-style:none;display:flex;gap:8px;align-items:baseline}
.guess summary::-webkit-details-marker{display:none}
.guess summary::before{content:"猜";flex:none;font-family:var(--f-display);font-weight:400;color:var(--cc)}
.guess summary::after{content:"翻开答案";margin-left:auto;flex:none;font-weight:400;font-size:12.5px;color:var(--ink-3);font-family:var(--f-mono)}
.guess[open] summary::after{content:"收起"}
.guess .ans{padding:0 12px 10px 12px;font-size:15.5px}
.guess .ans b{color:var(--cc)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:.3em 0 1em}
.sides div{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:14.5px;line-height:1.65;background:var(--paper)}
.sides b{display:block;font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--cc)}
@media (max-width:420px){.sides{grid-template-columns:1fr}}
.doubt{font-size:13.5px!important;text-indent:0!important;color:var(--ink-3);border-top:1px dotted var(--rule);padding-top:6px}
.doubt::before{content:"存疑";font-family:var(--f-mono);font-size:11px;border:1px solid var(--ink-3);border-radius:3px;padding:0 4px;margin-right:6px;vertical-align:1px}
.turn{margin:.8em 0 .4em;padding:10px 12px 6px;border-radius:9px;background:var(--paper);border:1px solid var(--rule)}
.turn b{display:block;font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--cc);margin-bottom:2px}
.turn ul{margin:0;padding:0;list-style:none}
.turn li{position:relative;padding-left:1.4em;margin:0 0 .45em;font-size:15.5px;line-height:1.7}
.turn li::before{content:"↪";position:absolute;left:0;color:var(--cc)}
.more{margin:.6em 0 0;font-size:13.5px;color:var(--ink-3)}
.more a{color:var(--ink-2)}
.seed{margin:.6em 0 0;font-size:13px;color:var(--ink-3);font-style:normal}

/* 有 JS 时：书架上的卡收起来，只露标题和开口 */
.js .grid .cd{cursor:pointer;transition:transform .15s,box-shadow .15s;padding-bottom:12px}
.js .grid .cd:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.js .grid .cd .body,.js .grid .cd .turn,.js .grid .cd .more,.js .grid .cd .seed{display:none}
.js .grid .cd h3{font-size:21px}
.js .grid .cd .hook{font-size:15px;margin:0;border-left-width:2px}
.js .grid .cd .hook::before{display:none}
.cd.told::after{content:"讲过了";position:absolute;right:12px;bottom:12px;font-family:var(--f-display);font-size:14px;color:var(--c-jq);border:1.5px solid var(--c-jq);border-radius:4px;padding:0 6px;transform:rotate(7deg);opacity:.85;background:var(--card)}
.js .grid .cd.told{opacity:.72}

/* 舞台上的卡 */
.stage .cd{padding:16px 18px 16px;box-shadow:0 10px 26px rgba(0,0,0,.09);animation:deal .32s ease-out}
.stage .cd h3{font-size:clamp(26px,6.4vw,32px)}
.stage .cd.told::after{top:44px;bottom:auto;right:16px;font-size:16px}
@keyframes deal{from{opacity:0;transform:translateY(10px) rotate(-1.2deg)}to{opacity:1;transform:none}}

/* 到楼下了 */
.closers{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:8px}
.closers li{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;font-family:var(--f-kai);font-size:16.5px;line-height:1.6;transition:box-shadow .2s,border-color .2s}
.closers li.pick{border-color:var(--lamp);box-shadow:0 0 0 2px var(--hl)}
.diy{margin-top:16px;border:1.5px dashed var(--rule);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--ink-2)}
.diy ol{margin:.3em 0 0;padding-left:1.4em}

/* 哪些是真的 */
.truth p{margin:0 0 1em;text-indent:2em;font-size:16px}
.truth ul{font-size:14.5px;color:var(--ink-2);padding-left:1.3em;line-height:1.75}
.truth li{margin-bottom:.4em}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:8px;margin:14px 0 0}
.shelf a{display:block;text-decoration:none;background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--c);border-radius:6px;padding:9px 12px;font-size:14px;color:var(--ink-2);line-height:1.5}
.shelf a b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--ink)}
footer{margin-top:60px;padding-block:22px calc(30px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);font-size:13.5px;color:var(--ink-3)}
footer p{margin:0 0 .5em}
</style>
</head>
<body>
<header class="bar g">
  <div class="bar-in">
    <a class="home" href="../">书房</a>
    <span class="name">回宿舍的路</span>
    <nav><a href="#draw">抽卡</a><a href="#all">全部</a><a href="#closers">到楼下</a></nav>
  </div>
</header>
<main>
