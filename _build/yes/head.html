<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="衙门里的处世术：拖延、开会、官话、问卷……从《是，大臣》《是，首相》《大明王朝1566》到两千年的史书，再到你身边的小组作业。一本带对白、漫画和小游戏的案卷。">
<meta property="og:title" content="是，大人 · 衙门里的处世术">
<meta property="og:description" content="怎样让一件事办不成而没有人负责？拖、委员会、官话、问卷——两千年的案卷，和你身边的回声。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='none' stroke='%23c0392b' stroke-width='3'/%3E%3Ctext x='16' y='22' font-size='15' text-anchor='middle' fill='%23c0392b' font-family='serif'%3E%E6%98%AF%3C/text%3E%3C/svg%3E">
<title>是，大人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@500;700&family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap">
<style>
/* 版式：一摞案卷。正文是卷宗纸，每一案的开头是牛皮纸卷宗封面，朱笔是批语，蓝笔是师爷的签条。 */
:root{
  --paper:#f2ede2;      /* 卷宗纸 */
  --paper-2:#e9e2d2;
  --card:#faf7f0;
  --kraft:#c49a5a;      /* 牛皮纸 */
  --kraft-2:#e3cfa8;
  --ink:#1c1b1a;
  --ink-2:#4c4944;
  --ink-3:#827c72;
  --rule:#d3c9b4;
  --zhu:#bf3a2b;        /* 朱批 */
  --lan:#2e5283;        /* 师爷的蓝笔 */
  --gold:#a07a26;
  --moss:#4d6b3a;
  --hl:color-mix(in srgb,var(--kraft) 34%,transparent);
  --c-paper:#fffdf8; --c-ink:#141414; --c-tone:#141414; /* 漫画纸与墨 */
  --f-display:"ZCOOL XiaoWei","Songti SC","STSong","Noto Serif SC",serif;
  --f-body:"Noto Serif SC","Songti SC","Source Han Serif SC","STSong",serif;
  --f-hand:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",cursive;
  --f-sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131312; --paper-2:#1a1a18; --card:#1d1c1a; --kraft:#b48a4e; --kraft-2:#3a3020;
  --ink:#e9e4d8; --ink-2:#b1aa9c; --ink-3:#7e786d; --rule:#34312b;
  --zhu:#e86a59; --lan:#8eaee0; --gold:#d6b25e; --moss:#9cc07f;
  --c-paper:#1b1a18; --c-ink:#ece6da; --c-tone:#ece6da; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131312; --paper-2:#1a1a18; --card:#1d1c1a; --kraft:#b48a4e; --kraft-2:#3a3020;
  --ink:#e9e4d8; --ink-2:#b1aa9c; --ink-3:#7e786d; --rule:#34312b;
  --zhu:#e86a59; --lan:#8eaee0; --gold:#d6b25e; --moss:#9cc07f;
  --c-paper:#1b1a18; --c-ink:#ece6da; --c-tone:#ece6da; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.9;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit;text-decoration-color:var(--zhu);text-underline-offset:3px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--zhu);outline-offset:2px}
svg{max-width:100%;height:auto;display:block}

/* 页眉 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{max-width:56rem;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:8px}
.bar .home{text-decoration:none;font-size:13px;color:var(--ink-3);white-space:nowrap;border:1px solid var(--rule);border-radius:999px;padding:1px 9px}
.bar .name{font-family:var(--f-display);font-size:19px;letter-spacing:.05em;white-space:nowrap}
.bar .vol{margin-left:auto;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .tocbtn{border:1px solid var(--rule);background:transparent;border-radius:6px;padding:0 8px;font-size:13px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--zhu);width:0}

/* 浮动目录 */
.drawer{position:fixed;inset:0;z-index:40;display:none}
.drawer.on{display:block}
.drawer .mask{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(360px,88vw);background:var(--paper);border-left:1px solid var(--rule);overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.drawer h5{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0 0 10px}
.drawer ol{list-style:none;margin:0;padding:0}
.drawer li a{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--rule);text-decoration:none;font-size:15px;line-height:1.5}
.drawer li a .n{font-family:var(--f-mono);font-size:12px;color:var(--zhu);min-width:3.2em;padding-top:2px}
.drawer li a small{display:block;color:var(--ink-3);font-size:12px}
.drawer .x{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--ink-2)}

main{display:block}
.col{max-width:38rem;margin-inline:auto}
.wide{max-width:54rem;margin-inline:auto}
.col p{margin:0 0 1.05em;text-indent:2em}
.col p.ni,.col .ni{text-indent:0}
h2,h3,h4{text-wrap:balance}
h3{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.4;margin:2.2em 0 .7em;letter-spacing:.03em}
h3 .y{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);margin-left:10px;letter-spacing:0;white-space:nowrap}
h3 .part{display:inline-block;font-family:var(--f-body);font-size:13px;color:var(--paper);background:var(--ink);border-radius:3px;padding:0 6px;margin-right:10px;vertical-align:3px;letter-spacing:.1em}
em{font-style:normal;background:linear-gradient(transparent 62%,var(--hl) 62%)}
strong{font-weight:600}
blockquote{margin:1.4em 0;padding:.2em 0 .2em 1.2em;border-left:2px solid var(--zhu);color:var(--ink-2)}
blockquote p{text-indent:0!important;margin:0 0 .4em}
blockquote cite{font-style:normal;font-size:14px;color:var(--ink-3)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.figcap{font-size:14px;color:var(--ink-2);line-height:1.7;margin-top:8px}

/* 封面 */
.hero{padding-block:44px 20px}
.hero .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--ink-3)}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(60px,14vw,128px);line-height:1;margin:.25em 0 .2em;letter-spacing:.08em}
.hero h1 .comma{color:var(--zhu)}
.hero h1 .sm{display:block;font-size:.2em;letter-spacing:.32em;color:var(--ink-2);margin-top:.6em}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px;align-items:center}
.hero-grid p{margin:0 0 1em;font-size:18px}

/* 公文：封面右侧那张呈文 */
.memo{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:22px 20px 18px;box-shadow:0 1px 0 var(--rule),6px 6px 0 -1px var(--paper-2),6px 6px 0 0 var(--rule)}
.memo .mh{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.1em;border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:10px}
.memo .mt{font-family:var(--f-display);font-size:22px;letter-spacing:.06em;margin:0 0 6px}
.memo .mb{font-size:15px;line-height:1.85;color:var(--ink-2);margin:0}
.memo .pi{margin-top:12px;font-family:var(--f-hand);color:var(--zhu);font-size:26px;line-height:1.3;min-height:1.3em;transition:opacity .4s}
.memo .stampbox{position:absolute;right:16px;bottom:14px;width:62px;height:62px;border:2.5px solid var(--zhu);color:var(--zhu);border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;line-height:1.05;text-align:center;transform:rotate(-14deg);opacity:0;transition:opacity .3s,transform .3s}
.memo.stamped .stampbox{opacity:.85;transform:rotate(-14deg) scale(1)}
.memo .mfoot{margin-top:12px;font-size:13.5px;color:var(--ink-3);min-height:2.8em;line-height:1.6;padding-right:70px}

/* 目录 */
.toc{list-style:none;margin:28px 0 0;padding:0;border-top:1px solid var(--rule)}
.toc li a,.toc li .soon{display:grid;grid-template-columns:3.8em minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.toc .n{font-family:var(--f-mono);font-size:12px;color:var(--zhu)}
.toc .t{font-family:var(--f-display);font-size:21px;line-height:1.3}
.toc .t small{display:block;font-family:var(--f-body);font-size:13px;color:var(--ink-3);margin-top:2px}
.toc .r{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);text-align:right;white-space:nowrap}
.toc li a:hover .t{color:var(--zhu)}
.toc .vh{padding:16px 0 4px;font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;color:var(--ink-3);border-bottom:1px solid var(--rule)}
.toc li .soon{opacity:.5}
.toc li .soon .r::before{content:"待续 · "}

/* 卷首（大分卷） */
.volhead{position:relative;max-width:54rem;margin:56px auto 20px;padding:30px 22px 24px;border-top:3px double var(--ink);border-bottom:3px double var(--ink)}
.volhead .num{font-family:var(--f-mono);font-size:12px;letter-spacing:.24em;color:var(--zhu)}
.volhead h2{font-family:var(--f-display);font-weight:400;font-size:clamp(64px,15vw,120px);line-height:1;margin:.1em 0 .12em;letter-spacing:.1em}
.volhead .lede{max-width:32em;margin:6px 0 0;font-size:16px;color:var(--ink-2);line-height:1.8}

/* 案卷封面 */
section.case{padding-top:24px}
.folder{position:relative;max-width:54rem;margin:46px auto 28px;padding:26px 22px 20px;background:var(--kraft-2);border-radius:4px 4px 6px 6px;color:var(--ink)}
.folder::before{content:"";position:absolute;left:22px;top:-14px;width:9em;height:16px;background:var(--kraft-2);border-radius:6px 6px 0 0}
.folder .no{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--zhu)}
.folder h2{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,9vw,64px);line-height:1.1;margin:.12em 0 .2em;letter-spacing:.08em}
.folder dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;margin:6px 0 0;font-size:14.5px;line-height:1.7}
.folder dt{color:var(--ink-3);white-space:nowrap}
.folder dd{margin:0;color:var(--ink-2)}
.folder .seal{position:absolute;right:18px;top:18px;border:2px solid var(--zhu);color:var(--zhu);border-radius:3px;padding:2px 8px;font-family:var(--f-display);font-size:17px;letter-spacing:.2em;transform:rotate(7deg);opacity:.8}
.folder .string{position:absolute;right:30px;bottom:-10px;width:20px;height:20px;border-radius:50%;border:2px solid var(--zhu);background:var(--kraft-2)}

/* 对白 */
.scene{margin:2em 0;border:1px solid var(--rule);border-radius:6px;background:var(--card);overflow:hidden}
.scene .sh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--paper-2)}
.scene .sh b{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.06em}
.scene .sh span{font-size:13px;color:var(--ink-3)}
.scene .bd{padding:12px 16px 14px}
.scene .ln{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:10px;margin:0 0 .55em;line-height:1.8}
.scene .ln .who{font-size:13px;text-align:right;padding-top:3px;white-space:nowrap;color:var(--ink-2)}
.scene .ln .who.s{color:var(--lan);font-weight:600}
.scene .ln .who.d{color:var(--zhu);font-weight:600}
.scene .ln .who.j{color:var(--gold);font-weight:600}
.scene .ln p{margin:0;text-indent:0!important}
.scene .sd{color:var(--ink-3);font-size:14px;margin:.2em 0 .7em 5.2em;line-height:1.7}
.scene .sd::before{content:"（"}.scene .sd::after{content:"）"}
.scene .aside{display:block;font-size:13.5px;color:var(--ink-3);margin-top:2px}
.cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15em),1fr));gap:12px;margin:1.4em 0}
.cast div{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--card);font-size:14.5px;line-height:1.7}
.cast b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;margin-bottom:2px}
.cast .s b{color:var(--lan)}.cast .d b{color:var(--zhu)}.cast .j b{color:var(--gold)}
.cast svg{width:64px;height:64px;float:right;margin:-4px -4px 0 6px}

/* 戏里戏外：剧情概述 */
.drama{margin:2em 0;padding:16px 18px;border-radius:6px;background:var(--ink);color:var(--paper)}
.drama .dh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.drama .dh b{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.06em}
.drama .dh span{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;opacity:.65}
.drama p{text-indent:0!important;margin:0 0 .6em;font-size:15.5px;line-height:1.85}
.drama ol{margin:.2em 0 .8em;padding-left:1.4em;font-size:15.5px;line-height:1.8}
.drama em{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--zhu) 55%,transparent) 62%)}
.drama .src{font-size:12.5px;opacity:.6}

/* 眉批 */
.echo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;margin:1.6em 0;padding:14px 14px 10px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.echo .stamp{writing-mode:vertical-rl;font-family:var(--f-display);font-size:15px;color:var(--zhu);border:1.5px solid var(--zhu);border-radius:3px;padding:6px 2px;letter-spacing:.2em;align-self:start}
.echo[data-k="讽刺"] .stamp{color:var(--lan);border-color:var(--lan)}
.echo[data-k="存疑"] .stamp{color:var(--ink-3);border-color:var(--ink-3)}
.echo[data-k="联系"] .stamp{color:var(--moss);border-color:var(--moss)}
.echo[data-k="生活"] .stamp{color:var(--gold);border-color:var(--gold)}
.echo p{text-indent:0!important;margin:0 0 .5em;font-size:15.5px;line-height:1.8}
.echo .rh{font-family:var(--f-display);font-size:18px;margin-bottom:.2em}
.echo .ry{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);margin-right:8px}

/* 朱批：页边的红笔 */
.zp{font-family:var(--f-hand);color:var(--zhu);font-size:22px;line-height:1.4;margin:-.3em 0 1em;text-indent:0!important;transform:rotate(-1.5deg);transform-origin:left}
.zp::before{content:"朱批：";font-size:.62em;font-family:var(--f-body);vertical-align:2px;opacity:.8}

/* 识破它 / 反制 */
.see{margin:2em 0;border:1.5px dashed var(--lan);border-radius:8px;padding:14px 16px 8px;background:color-mix(in srgb,var(--lan) 5%,transparent)}
.see h5,.counter h5{margin:0 0 8px;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.08em}
.see h5{color:var(--lan)}
.see ul,.counter ul{margin:0 0 .6em;padding-left:1.2em;font-size:15.5px;line-height:1.8}
.see li,.counter li{margin:0 0 .35em}
.counter{margin:2em 0;border:1.5px solid var(--moss);border-radius:8px;padding:14px 16px 8px}
.counter h5{color:var(--moss)}
.counter .who3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14em),1fr));gap:12px}
.counter .who3 div{font-size:15px;line-height:1.75}
.counter .who3 b{display:block;font-size:13px;color:var(--ink-3);font-weight:400;letter-spacing:.1em;margin-bottom:2px}

/* 带走 */
.takeaway{margin:2.4em 0 1em;padding:16px 18px;border:1.5px solid var(--zhu);border-radius:6px;position:relative}
.takeaway::before{content:"带走";position:absolute;top:-11px;left:14px;background:var(--paper);padding:0 6px;font-family:var(--f-display);color:var(--zhu);font-size:15px;letter-spacing:.2em}
.takeaway p{text-indent:0!important;margin:0 0 .4em}
.takeaway .life{font-size:15px;color:var(--ink-2)}

/* 装置 */
.fig{margin:2.2em auto;padding:20px 18px;background:var(--card);border:1px solid var(--rule);border-radius:6px}
.fig-label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;color:var(--zhu)}
.fig h4{font-family:var(--f-display);font-weight:400;font-size:22px;margin:.25em 0 .35em}
.fig .how{font-size:14.5px;color:var(--ink-2);margin:0 0 14px;line-height:1.75}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--ink-3);background:transparent;border-radius:999px;padding:4px 14px;font-size:14px;cursor:pointer;line-height:1.6;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.red{background:var(--zhu);color:#fff;border-color:var(--zhu)}
.btn.on{background:var(--lan);border-color:var(--lan);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.readout{font-size:14.5px;color:var(--ink-2);line-height:1.7}
.readout b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.rng{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.rng output{font-family:var(--f-mono);min-width:4.5em;text-align:right}
input[type=range]{width:100%;accent-color:var(--zhu)}
.meter{height:10px;border-radius:5px;background:var(--paper-2);overflow:hidden;border:1px solid var(--rule)}
.meter i{display:block;height:100%;background:var(--lan);transition:width .4s}
.log{font-size:14px;line-height:1.7;color:var(--ink-2);max-height:16em;overflow:auto;border-top:1px dashed var(--rule);margin-top:10px;padding-top:8px}
.log div{margin:0 0 6px}
.log .ms{color:var(--lan)}
.log .me{color:var(--zhu)}
.log .sys{color:var(--ink-3);font-size:13px}

/* 装置 1：拖字诀 */
.stall .cal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin:6px 0 4px}
.stall .cal i{height:14px;border-radius:2px;background:var(--paper-2);border:1px solid var(--rule);transition:background .3s}
.stall .cal i.used{background:var(--ink-3)}
.stall .cal i.elec{background:var(--zhu);border-color:var(--zhu)}
.stall .stage{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.stall .stage span{font-size:12px;border:1px solid var(--rule);border-radius:4px;padding:0 6px;color:var(--ink-3)}
.stall .stage span.on{border-color:var(--lan);color:var(--lan)}
.stall .stage span.done{text-decoration:line-through}
.stall .say{min-height:4.6em;background:var(--paper);border-left:3px solid var(--lan);padding:8px 12px;margin:10px 0;font-size:15.5px;line-height:1.75}
.stall .say b{color:var(--lan);font-weight:600;font-size:13px;display:block}
.stall .opts{display:grid;gap:8px}
.stall .opts button{text-align:left;border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:8px 12px;cursor:pointer;line-height:1.6;font-size:15px}
.stall .opts button:hover{border-color:var(--ink-3)}
.stall .end{border:1.5px solid var(--zhu);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:15px;line-height:1.75}

/* 装置 2：委员会 */
.cmt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
.cmt svg{max-width:300px;margin:auto}

/* 装置 3：官话翻译机 */
.dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15em),1fr));gap:10px}
.dict button{position:relative;text-align:left;border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:10px 12px 10px;cursor:pointer;line-height:1.55;min-height:6.2em}
.dict button .o{display:block;font-size:16px;font-weight:600}
.dict button .src{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.dict button .tr{display:block;font-family:var(--f-hand);color:var(--zhu);font-size:20px;line-height:1.35;margin-top:6px;opacity:0;transform:translateY(-3px);transition:opacity .25s,transform .25s}
.dict button.on .tr{opacity:1;transform:none}
.dict button.on{border-color:var(--zhu)}

/* 装置 4：民调工厂 */
.poll .qs{display:grid;gap:6px;margin:8px 0}
.poll .qs button{text-align:left;border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:7px 12px;cursor:pointer;font-size:15px;line-height:1.55}
.poll .qs button.pick{border-color:var(--lan);box-shadow:0 0 0 2px color-mix(in srgb,var(--lan) 25%,transparent)}
.poll .qs button .k{font-size:12px;color:var(--ink-3);margin-left:6px}
.poll .slot{min-height:2.2em;font-size:15px;line-height:1.7;margin:4px 0}
.poll .slot span{display:inline-block;border:1px solid var(--lan);color:var(--lan);border-radius:4px;padding:0 6px;margin:2px 4px 2px 0;font-size:13px}
.poll .res{display:grid;grid-template-columns:4.5em minmax(0,1fr) 3.5em;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.poll .res .meter i.no{background:var(--zhu)}
.poll .res output{font-family:var(--f-mono);text-align:right}

/* 装置 5：识破它 */
.quiz .qcard{border-top:1px dashed var(--rule);padding-top:12px;margin-top:6px}
.quiz .qn{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.quiz .qt{font-size:16px;line-height:1.8;margin:4px 0 10px}
.quiz .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,10em),1fr));gap:8px}
.quiz .opts button{border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:7px 10px;cursor:pointer;font-size:15px;line-height:1.5}
.quiz .opts button.ok{border-color:var(--moss);background:color-mix(in srgb,var(--moss) 14%,var(--paper))}
.quiz .opts button.bad{border-color:var(--zhu);background:color-mix(in srgb,var(--zhu) 10%,var(--paper))}
.quiz .ex{font-size:14.5px;color:var(--ink-2);line-height:1.75;margin-top:10px;min-height:1em}
.quiz .score{font-family:var(--f-mono);font-size:13px;color:var(--ink-3)}

/* 漫画 */
.comic{max-width:54rem;margin:2em auto;padding:14px;background:var(--c-paper);border:2px solid var(--c-ink);color:var(--c-ink)}
.comic .ctitle{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px;border-bottom:2px solid var(--c-ink);padding-bottom:6px;margin-bottom:12px}
.comic .ctitle b{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.12em}
.comic .ctitle span{font-family:var(--f-sans);font-size:12px;letter-spacing:.1em}
.comic .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pn{position:relative;border:2.5px solid var(--c-ink);background:var(--c-paper);overflow:hidden;container-type:inline-size;aspect-ratio:300/230}
.pn.w{grid-column:span 2;aspect-ratio:600/250}
.pn svg{position:absolute;inset:0;width:100%;height:100%;max-width:none}
.pn .cap{position:absolute;left:0;top:0;max-width:62%;background:var(--c-paper);border-right:2px solid var(--c-ink);border-bottom:2px solid var(--c-ink);font-family:var(--f-sans);font-weight:500;font-size:clamp(10.5px,4.1cqw,15px);line-height:1.45;padding:4px 8px;z-index:2}
.pn .cap.br{left:auto;top:auto;right:0;bottom:0;border:0;border-left:2px solid var(--c-ink);border-top:2px solid var(--c-ink)}
.pn .bb{position:absolute;z-index:3;background:var(--c-paper);border:2px solid var(--c-ink);border-radius:50%/42%;padding:.55em .9em;font-family:var(--f-sans);font-weight:500;font-size:clamp(10.5px,4.3cqw,16px);line-height:1.45;text-align:center;color:var(--c-ink)}
.pn.w .bb{font-size:clamp(10.5px,2.5cqw,16px)}
.pn.w .cap{font-size:clamp(10.5px,2.4cqw,15px)}
.pn .bb::after{content:"";position:absolute;width:14px;height:14px;background:var(--c-paper);border-right:2px solid var(--c-ink);border-bottom:2px solid var(--c-ink);bottom:-8px;left:30%;transform:skewX(30deg) rotate(45deg)}
.pn .bb.tr::after{left:auto;right:28%;transform:skewX(-30deg) rotate(45deg)}
.pn .bb.nt::after{display:none}
.pn .bb.shout{border-radius:6px;border-width:2.5px;font-weight:700}
.pn .bb.think{border-style:dashed}
.pn .sfx{position:absolute;z-index:2;font-family:var(--f-sans);font-weight:700;font-size:clamp(14px,7cqw,30px);color:var(--c-ink);-webkit-text-stroke:0;transform:rotate(-8deg);letter-spacing:.05em;text-shadow:2px 2px 0 var(--c-paper),-2px -2px 0 var(--c-paper),2px -2px 0 var(--c-paper),-2px 2px 0 var(--c-paper)}
.comic .after{font-family:var(--f-sans);font-size:13px;margin:10px 0 0;opacity:.75}

/* 表 */
table.t{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.6;min-width:520px}
table.t th,table.t td{border-bottom:1px solid var(--rule);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{font-weight:400;color:var(--ink-3);font-size:13px}

/* 尾部 */
footer{max-width:38rem;margin:60px auto 0;padding:24px 0 calc(40px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule);font-size:14px;color:var(--ink-3);line-height:1.8}
footer p{text-indent:0!important}
.nextbook{display:block;margin:20px 0;padding:14px 16px;border:1px solid var(--rule);border-radius:6px;text-decoration:none;background:var(--card)}
.nextbook b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ink)}

@media (max-width:700px){
  body{font-size:16.5px}
  .hero-grid,.cmt{grid-template-columns:minmax(0,1fr)}
  .toc li a,.toc li .soon{grid-template-columns:3.2em minmax(0,1fr)}
  .toc .r{grid-column:2;text-align:left}
  .scene .ln{grid-template-columns:minmax(0,1fr);gap:0}
  .scene .ln .who{text-align:left;padding-top:0}
  .scene .sd{margin-left:0}
  .bar .vol{display:none}
  .folder .seal{position:static;display:inline-block;margin-bottom:6px}
}
@media (max-width:560px){
  .comic{padding:10px}
  .comic .grid{grid-template-columns:minmax(0,1fr)}
  .pn.w{grid-column:auto;aspect-ratio:600/330}
  .pn.w .bb{font-size:clamp(10.5px,3.6cqw,15px)}
  .pn.w .cap{font-size:clamp(10.5px,3.5cqw,14px)}
}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>
